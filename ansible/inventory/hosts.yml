---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      # Seconds to wait for sudo's password prompt or success marker (local
      # connection default: 10). A single slow sudo, e.g. right after a vendor
      # .deb's installer stops its app, otherwise aborts the whole run.
      ansible_local_become_success_timeout: 30
