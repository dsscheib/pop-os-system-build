---
- name: Prevent Google Chrome package from creating a duplicate APT source
  ansible.builtin.copy:
    content: |
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
    dest: /etc/default/google-chrome
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Google Chrome APT signing key
  ansible.builtin.get_url:
    url: "{{ pinned_downloads.google_chrome_key.url }}"
    dest: /etc/apt/keyrings/google-chrome.asc
    checksum: "sha256:{{ pinned_downloads.google_chrome_key.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove legacy and Chrome-managed APT source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/google-chrome.list
    - /etc/apt/sources.list.d/google-chrome.sources
  become: true

- name: Configure Google Chrome deb822 APT repository
  ansible.builtin.deb822_repository:
    name: pop-google-chrome
    types:
      - deb
    uris:
      - https://dl.google.com/linux/chrome/deb/
    suites:
      - stable
    components:
      - main
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/google-chrome.asc
  become: true
  notify: Update browsers APT cache

- name: Flush browsers handlers before installing Google Chrome
  ansible.builtin.meta: flush_handlers

- name: Check whether Google Chrome deb822 repository is configured on disk
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pop-google-chrome.sources
  register: browsers_chrome_repo_stat

- name: Install Google Chrome stable
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present
  become: true
  when: not ansible_check_mode or browsers_chrome_repo_stat.stat.exists

- name: Verify Google Chrome executable version
  ansible.builtin.command:
    argv:
      - google-chrome
      - --version
  changed_when: false
  when: not ansible_check_mode
