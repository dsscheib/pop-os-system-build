---
- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Mozilla APT signing key
  ansible.builtin.get_url:
    url: "{{ pinned_downloads.mozilla_key.url }}"
    dest: /etc/apt/keyrings/mozilla.asc
    checksum: "sha256:{{ pinned_downloads.mozilla_key.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove legacy Mozilla APT source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/mozilla.list
    state: absent
  become: true

- name: Configure Mozilla deb822 APT repository
  ansible.builtin.deb822_repository:
    name: mozilla
    types:
      - deb
    uris:
      - https://packages.mozilla.org/apt
    suites:
      - mozilla
    components:
      - main
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/mozilla.asc
  become: true
  notify: Update browsers APT cache

- name: Pin Mozilla APT packages priority
  ansible.builtin.copy:
    content: |
      Package: firefox*
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    dest: /etc/apt/preferences.d/mozilla
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Flush browsers handlers before installing Firefox Developer Edition
  ansible.builtin.meta: flush_handlers

- name: Check whether Mozilla deb822 repository is configured on disk
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/mozilla.sources
  register: browsers_mozilla_repo_stat

- name: Install Firefox Developer Edition
  ansible.builtin.apt:
    name: firefox-devedition
    state: present
  become: true
  when: not ansible_check_mode or browsers_mozilla_repo_stat.stat.exists

- name: Ensure Firefox system policy directory exists
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Write Firefox system policies
  ansible.builtin.copy:
    content: "{{ {'policies': firefox_policies} | to_nice_json }}\n"
    dest: /etc/firefox/policies/policies.json
    owner: root
    group: root
    mode: "0644"
  become: true
