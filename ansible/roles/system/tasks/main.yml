---
- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install base, dependency, and system APT packages
  ansible.builtin.apt:
    name: "{{ apt_base_packages + apt_dependency_packages + apt_system_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Apply safe APT package upgrades
  ansible.builtin.apt:
    upgrade: safe
  become: true
  when: system_apt_upgrade | bool

- name: Download GitHub CLI APT signing key
  ansible.builtin.get_url:
    url: "{{ pinned_downloads.githubcli_key.url }}"
    dest: /etc/apt/keyrings/githubcli.gpg
    checksum: "sha256:{{ pinned_downloads.githubcli_key.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove legacy GitHub CLI APT source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/githubcli.list
    state: absent
  become: true

- name: Configure GitHub CLI deb822 APT repository
  ansible.builtin.deb822_repository:
    name: githubcli
    types:
      - deb
    uris:
      - https://cli.github.com/packages
    suites:
      - stable
    components:
      - main
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/githubcli.gpg
  become: true
  notify: Update system APT cache

- name: Flush system handlers before installing GitHub CLI
  ansible.builtin.meta: flush_handlers

- name: Install GitHub CLI package
  ansible.builtin.apt:
    name: gh
    state: present
  become: true

- name: Ensure hardware device groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
    system: true
  loop:
    - dialout
    - plugdev
  become: true

- name: Add workstation user to dialout and plugdev groups
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups:
      - dialout
      - plugdev
    append: true
  become: true

- name: Ensure systemd journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install journald retention drop-in
  ansible.builtin.copy:
    src: "{{ repo_root }}/resources/systemd/journald.conf"
    dest: /etc/systemd/journald.conf.d/zz-pop-workstation.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart systemd-journald

- name: Install Samsung 970 EVO NVMe power-management udev rule
  ansible.builtin.copy:
    src: "{{ repo_root }}/resources/udev/99-samsung-970-evo-nvme.rules"
    dest: /etc/udev/rules.d/99-samsung-970-evo-nvme.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload udev rules
  when: install_samsung_970_evo_nvme_rule | bool

- name: Enable UFW firewall on live hosts
  community.general.ufw:
    state: enabled
  become: true
  tags:
    - systemd_live

- name: Enable and start systemd-oomd on live hosts
  ansible.builtin.systemd_service:
    name: systemd-oomd.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags:
    - systemd_live
