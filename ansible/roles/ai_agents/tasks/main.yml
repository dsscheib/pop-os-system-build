---
- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ workstation_local_bin }}"
    state: directory
    mode: "0755"
  tags:
    - ai_agents

- name: Install Claude Code CLI from Anthropic APT repository
  tags:
    - ai_agents
    - claudecode
  block:
    - name: Ensure APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Download Claude Code APT signing key
      ansible.builtin.get_url:
        url: "{{ pinned_downloads.claude_code_key.url }}"
        dest: /etc/apt/keyrings/claude-code.asc
        checksum: "sha256:{{ pinned_downloads.claude_code_key.sha256 }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Remove legacy Claude Code APT source list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/claude-code.list
        state: absent
      become: true

    - name: Configure Claude Code deb822 APT repository
      ansible.builtin.deb822_repository:
        name: claude-code
        types:
          - deb
        uris:
          - https://downloads.claude.ai/claude-code/apt/latest
        suites:
          - latest
        components:
          - main
        architectures:
          - amd64
        signed_by: /etc/apt/keyrings/claude-code.asc
      become: true
      notify: Update ai_agents APT cache

    - name: Flush ai_agents handlers before installing Claude Code
      ansible.builtin.meta: flush_handlers

    - name: Install claude-code package
      ansible.builtin.apt:
        name: claude-code
        state: present
      become: true

    - name: Verify Claude Code CLI version
      ansible.builtin.command:
        argv:
          - claude
          - --version
      changed_when: false
      when: not ansible_check_mode

- name: Install Antigravity CLI and destructive-git guardrails
  tags:
    - ai_agents
    - antigravity
  block:
    - name: Set Antigravity CLI path facts
      ansible.builtin.set_fact:
        ai_agents_agy_base: "{{ workstation_home }}/.local/share/pop-workstation"
        ai_agents_agy_versions: "{{ workstation_home }}/.local/share/pop-workstation/.antigravity-cli.versions"
        ai_agents_agy_version_dir: >-
          {{ workstation_home ~ '/.local/share/pop-workstation/.antigravity-cli.versions/'
             ~ pinned_downloads.antigravity_cli.version }}
        ai_agents_agy_link: "{{ workstation_home }}/.local/share/pop-workstation/antigravity-cli"

    - name: Ensure Antigravity CLI versions directory exists
      ansible.builtin.file:
        path: "{{ ai_agents_agy_versions }}"
        state: directory
        mode: "0755"

    - name: Check whether pinned Antigravity CLI binary is installed
      ansible.builtin.stat:
        path: "{{ ai_agents_agy_version_dir }}/antigravity"
      register: ai_agents_agy_stat

    - name: Download and extract pinned Antigravity CLI release
      when:
        - not ai_agents_agy_stat.stat.exists
        - not ansible_check_mode
      block:
        - name: Create temporary workspace for Antigravity CLI download
          ansible.builtin.tempfile:
            state: directory
            prefix: pop-agy-
          register: ai_agents_agy_tmpdir

        - name: Download verified Antigravity CLI archive
          ansible.builtin.get_url:
            url: "{{ pinned_downloads.antigravity_cli.url }}"
            dest: "{{ ai_agents_agy_tmpdir.path }}/antigravity-cli.tar.gz"
            checksum: "sha256:{{ pinned_downloads.antigravity_cli.sha256 }}"
            mode: "0644"

        - name: Extract Antigravity CLI archive safely
          ansible.builtin.command:
            argv:
              - python3
              - "{{ repo_root }}/scripts/st_assets.py"
              - tar
              - "{{ ai_agents_agy_tmpdir.path }}/antigravity-cli.tar.gz"
              - "{{ ai_agents_agy_version_dir }}"
          changed_when: true

        - name: Validate extracted Antigravity CLI binary
          ansible.builtin.command:
            argv:
              - "{{ ai_agents_agy_version_dir }}/antigravity"
              - --version
          changed_when: false

        - name: Remove temporary Antigravity CLI workspace
          ansible.builtin.file:
            path: "{{ ai_agents_agy_tmpdir.path }}"
            state: absent

    - name: Link active Antigravity CLI directory
      ansible.builtin.file:
        src: "{{ ai_agents_agy_version_dir }}"
        dest: "{{ ai_agents_agy_link }}"
        state: link
        force: true
        mode: "0755"
      when: not ansible_check_mode

    - name: Install agy launcher in ~/.local/bin
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          exec "{{ ai_agents_agy_link }}/antigravity" "$@"
        dest: "{{ workstation_local_bin }}/agy"
        mode: "0755"

    - name: Verify agy launcher version
      ansible.builtin.command:
        argv:
          - "{{ workstation_local_bin }}/agy"
          - --version
      changed_when: false
      when: not ansible_check_mode

    - name: Apply Antigravity destructive-git ask guardrails
      ansible.builtin.command:
        argv:
          - python3
          - -B
          - "{{ repo_root }}/scripts/antigravity_permissions.py"
      register: ai_agents_agy_guardrails
      changed_when: "'Added ' in ai_agents_agy_guardrails.stdout"
      when: not ansible_check_mode

- name: Generate dynamic shell completions for installed CLIs
  tags:
    - ai_agents
    - completions
  block:
    - name: Ensure shell completion directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "u+rwx,g+rx,o+rx"
      loop:
        - "{{ workstation_home }}/.local/share/bash-completion/completions"
        - "{{ workstation_home }}/.zsh/completion"
        - "{{ workstation_home }}/.config/fish/completions"

    - name: Locate dynamic completion generators
      ansible.builtin.command:
        argv:
          - which
          - "{{ item }}"
      environment:
        PATH: >-
          {{ [
            workstation_local_bin,
            workstation_home ~ '/.local/share/mise/shims',
            workstation_home ~ '/.cargo/bin',
            ansible_facts['env'].PATH | default('/usr/bin:/bin'),
          ] | join(':') }}
      loop:
        - codex
        - herdr
        - rustup
      register: ai_agents_completion_tools
      changed_when: false
      failed_when: false

    - name: Set located tool map for dynamic completions
      ansible.builtin.set_fact:
        ai_agents_tool_paths:
          codex: "{{ ai_agents_completion_tools.results[0].stdout | default('') | trim }}"
          herdr: "{{ ai_agents_completion_tools.results[1].stdout | default('') | trim }}"
          rustup: "{{ ai_agents_completion_tools.results[2].stdout | default('') | trim }}"

    - name: Generate Codex shell completions
      ansible.builtin.command:
        argv:
          - "{{ ai_agents_tool_paths.codex }}"
          - completion
          - "{{ item.shell }}"
      loop:
        - shell: bash
          dest: "{{ workstation_home }}/.local/share/bash-completion/completions/codex"
        - shell: zsh
          dest: "{{ workstation_home }}/.zsh/completion/_codex"
        - shell: fish
          dest: "{{ workstation_home }}/.config/fish/completions/codex.fish"
      register: ai_agents_codex_completions
      changed_when: false
      when:
        - ai_agents_tool_paths.codex | length > 0
        - not ansible_check_mode

    - name: Install generated Codex shell completions
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ item.item.dest }}"
        mode: "0644"
      loop: "{{ ai_agents_codex_completions.results | default([]) }}"
      when:
        - ai_agents_tool_paths.codex | length > 0
        - not ansible_check_mode
        - item.stdout is defined

    - name: Generate Herdr shell completions
      ansible.builtin.command:
        argv:
          - "{{ ai_agents_tool_paths.herdr }}"
          - completion
          - "{{ item.shell }}"
      loop:
        - shell: bash
          dest: "{{ workstation_home }}/.local/share/bash-completion/completions/herdr"
        - shell: zsh
          dest: "{{ workstation_home }}/.zsh/completion/_herdr"
        - shell: fish
          dest: "{{ workstation_home }}/.config/fish/completions/herdr.fish"
      register: ai_agents_herdr_completions
      changed_when: false
      when:
        - ai_agents_tool_paths.herdr | length > 0
        - not ansible_check_mode

    - name: Install generated Herdr shell completions
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ item.item.dest }}"
        mode: "0644"
      loop: "{{ ai_agents_herdr_completions.results | default([]) }}"
      when:
        - ai_agents_tool_paths.herdr | length > 0
        - not ansible_check_mode
        - item.stdout is defined

    - name: Generate Rustup shell completions
      ansible.builtin.command:
        argv:
          - "{{ ai_agents_tool_paths.rustup }}"
          - completions
          - "{{ item.shell }}"
      loop:
        - shell: bash
          dest: "{{ workstation_home }}/.local/share/bash-completion/completions/rustup"
        - shell: zsh
          dest: "{{ workstation_home }}/.zsh/completion/_rustup"
        - shell: fish
          dest: "{{ workstation_home }}/.config/fish/completions/rustup.fish"
      register: ai_agents_rustup_completions
      changed_when: false
      when:
        - ai_agents_tool_paths.rustup | length > 0
        - not ansible_check_mode

    - name: Install generated Rustup shell completions
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ item.item.dest }}"
        mode: "0644"
      loop: "{{ ai_agents_rustup_completions.results | default([]) }}"
      when:
        - ai_agents_tool_paths.rustup | length > 0
        - not ansible_check_mode
        - item.stdout is defined

    - name: Generate Cargo shell completions
      ansible.builtin.command:
        argv:
          - "{{ ai_agents_tool_paths.rustup }}"
          - completions
          - "{{ item.shell }}"
          - cargo
      loop:
        - shell: bash
          dest: "{{ workstation_home }}/.local/share/bash-completion/completions/cargo"
        - shell: zsh
          dest: "{{ workstation_home }}/.zsh/completion/_cargo"
      register: ai_agents_cargo_completions
      changed_when: false
      when:
        - ai_agents_tool_paths.rustup | length > 0
        - not ansible_check_mode

    - name: Install generated Cargo shell completions
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ item.item.dest }}"
        mode: "0644"
      loop: "{{ ai_agents_cargo_completions.results | default([]) }}"
      when:
        - ai_agents_tool_paths.rustup | length > 0
        - not ansible_check_mode
        - item.stdout is defined
